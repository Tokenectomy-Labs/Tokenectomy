<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%" style="background:#0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Title & Specs -->
  <text x="36" y="42" fill="#f0f6fc" font-size="19" font-weight="700">Benchmark: 250,000-Line Log Surgery &amp; Redaction</text>
  <text x="36" y="66" fill="#8b949e" font-size="13">Measured on Intel Core i5-1235U @ 15W • Arch Linux 6.13 • Higher is faster</text>

  <!-- Grid lines -->
  <g transform="translate(36, 95)">
    <line x1="220" y1="0" x2="220" y2="155" stroke="#21262d" stroke-width="1" />
    <line x1="365" y1="0" x2="365" y2="155" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="510" y1="0" x2="510" y2="155" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="655" y1="0" x2="655" y2="155" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4" />

    <text x="220" y="172" fill="#6e7681" font-size="11" text-anchor="middle">0</text>
    <text x="365" y="172" fill="#6e7681" font-size="11" text-anchor="middle">175,000 l/s</text>
    <text x="510" y="172" fill="#6e7681" font-size="11" text-anchor="middle">350,000 l/s</text>
    <text x="655" y="172" fill="#6e7681" font-size="11" text-anchor="middle">525,000 l/s</text>

    <!-- 1. Tokenectomy (Rust) -->
    <text x="205" y="23" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="end">Tokenectomy (Rust)</text>
    <rect x="220" y="5" width="440" height="28" rx="4" fill="url(#barCyan)" />
    <text x="672" y="24" fill="#38bdf8" font-size="13" font-weight="700" font-family="monospace">530,735 lines/s (0.18ms)</text>

    <!-- 2. Go stdlib -->
    <text x="205" y="61" fill="#c9d1d9" font-size="13" text-anchor="end">Go stdlib sanitizer</text>
    <rect x="220" y="43" width="158" height="28" rx="4" fill="#30363d" />
    <text x="388" y="62" fill="#8b949e" font-size="12" font-family="monospace">190,400 lines/s (1.3ms)</text>

    <!-- 3. Node.js -->
    <text x="205" y="99" fill="#c9d1d9" font-size="13" text-anchor="end">Node.js regex pipeline</text>
    <rect x="220" y="81" width="43" height="28" rx="4" fill="#30363d" />
    <text x="273" y="100" fill="#8b949e" font-size="12" font-family="monospace">52,100 lines/s (28.4ms)</text>

    <!-- 4. Python -->
    <text x="205" y="137" fill="#c9d1d9" font-size="13" text-anchor="end">Python re scrubber</text>
    <rect x="220" y="119" width="20" height="28" rx="4" fill="#30363d" />
    <text x="250" y="138" fill="#8b949e" font-size="12" font-family="monospace">24,500 lines/s (42.6ms)</text>
  </g>

  <!-- Footer -->
  <text x="36" y="300" fill="#6e7681" font-size="11" font-family="monospace">Reproduce: cargo test --release --test stress_benchmark -- --nocapture</text>
</svg>
