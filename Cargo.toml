[package]
name = "tokenectomy"
version = "1.0.0"
edition = "2024"
description = "Autonomous M2M Model Context Protocol (MCP) server & log surgery engine for AI coding agents (Claude, Cursor, Cline, Antigravity)"
license = "MIT"
repository = "https://github.com/daffa2555/Tokenectomy"
homepage = "https://github.com/daffa2555/Tokenectomy"
documentation = "https://docs.rs/tokenectomy"
readme = "README.md"
keywords = ["mcp", "mcp-server", "ai-agent", "context-window", "llm"]
categories = ["development-tools", "command-line-utilities", "text-processing"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "env"] }
colored = "3.1.1"
dirs = "6.0.0"
env_logger = "0.11.11"
indicatif = "0.18.6"
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["gzip", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
urlencoding = "2.1.3"

[lib]
name = "tokenectomy"
path = "src/lib.rs"
