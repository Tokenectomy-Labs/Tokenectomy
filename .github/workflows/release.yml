name: Unified Release & Publish

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.1.8). If blank, uses current commit ref.'
        required: false
        default: ''
      publish_npm:
        description: 'Publish package to npm'
        type: boolean
        default: true
      publish_cargo:
        description: 'Publish crate to crates.io'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_suffix: linux-amd64
            bin_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_suffix: macos-arm64
            bin_ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            platform_suffix: macos-intel
            bin_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_suffix: windows-amd64.exe
            bin_ext: ".exe"

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tokenectomy${{ matrix.bin_ext }} dist/tokenectomy-${{ matrix.platform_suffix }}
          cp target/${{ matrix.target }}/release/razor${{ matrix.bin_ext }} dist/razor-${{ matrix.platform_suffix }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish npm Package
    needs: [build]
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && (github.event.inputs.publish_npm != false)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Sync version and README
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            cd packages/tokenectomy-razor
            npm version $VERSION --no-git-tag-version --allow-same-version || true
            cd ../..
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION=${{ github.event.inputs.release_tag }}
            VERSION=${VERSION#v}
            cd packages/tokenectomy-razor
            npm version $VERSION --no-git-tag-version --allow-same-version || true
            cd ../..
          fi
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          cd packages/tokenectomy-razor
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cargo:
    name: Publish Crates.io Package
    needs: [build]
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && (github.event.inputs.publish_cargo != false)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to Crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty || echo "Cargo publish completed or skipped"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}


