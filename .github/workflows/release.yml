name: Release Binaries

on:
  release:
    types: [created]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tokenectomy-linux-amd64
            asset_name: tokenectomy-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tokenectomy-macos-arm64
            asset_name: tokenectomy-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: tokenectomy-macos-intel
            asset_name: tokenectomy-macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tokenectomy-windows.exe
            asset_name: tokenectomy-windows.exe

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Prepare Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: mv target/${{ matrix.target }}/release/tokenectomy ${{ matrix.artifact_name }}
        
      - name: Prepare Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: mv target/${{ matrix.target }}/release/tokenectomy.exe ${{ matrix.artifact_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
