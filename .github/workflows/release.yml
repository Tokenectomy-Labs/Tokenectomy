name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_suffix: linux-amd64
            bin_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_suffix: macos-arm64
            bin_ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            platform_suffix: macos-intel
            bin_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_suffix: windows-amd64.exe
            bin_ext: ".exe"

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tokenectomy${{ matrix.bin_ext }} dist/tokenectomy-${{ matrix.platform_suffix }}
          cp target/${{ matrix.target }}/release/razor${{ matrix.bin_ext }} dist/razor-${{ matrix.platform_suffix }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish npm Package
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Sync version with git tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cd packages/tokenectomy-razor
          npm version $VERSION --no-git-tag-version --allow-same-version || true
      - name: Publish to npm
        run: |
          cd packages/tokenectomy-razor
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

