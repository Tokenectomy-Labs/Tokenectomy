name: Attest Existing Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to sign and attest (e.g. v1.3.3)"
        required: true
        default: "v1.3.3"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attest-release:
    name: Attest Existing Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Release Assets
        run: |
          mkdir -p dist
          gh release download "${{ inputs.release_tag }}" --dir dist --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA Build Attestation
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*'

      - name: Upload Attestation and Sigstore Bundles to Release
        run: |
          if [ -n "${{ steps.attest.outputs.bundle-path }}" ] && [ -f "${{ steps.attest.outputs.bundle-path }}" ]; then
            cp "${{ steps.attest.outputs.bundle-path }}" dist/provenance.intoto.jsonl
            cp "${{ steps.attest.outputs.bundle-path }}" dist/tokenectomy.sigstore.json
            gh release upload "${{ inputs.release_tag }}" dist/provenance.intoto.jsonl dist/tokenectomy.sigstore.json --clobber --repo "${{ github.repository }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
