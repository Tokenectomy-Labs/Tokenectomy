name: Tokenectomy PR Verification Gate

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  tokenectomy-gate:
    name: Deterministic AST PR Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Generate Tmy-Joy App Token
        id: tmy-joy-token
        uses: actions/create-github-app-token@21cfef2b496dd8ef5b904c159339626a10ad380e # v1.11.6
        continue-on-error: true
        with:
          app-id: ${{ secrets.TMY_JOY_APP_ID }}
          private-key: ${{ secrets.TMY_JOY_PRIVATE_KEY }}

      - name: Run Tokenectomy PR Gate
        uses: Tokenectomy-Labs/tokenectomy-bot@main
        with:
          fail_on: error
          agent_pr: true
          github_token: ${{ steps.tmy-joy-token.outputs.token || secrets.GITHUB_TOKEN }}
