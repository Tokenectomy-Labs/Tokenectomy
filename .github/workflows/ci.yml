name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Compilation
        run: cargo check --all-targets

      - name: Run Unit Tests
        run: cargo test --all-targets

  stress-benchmark:
    name: Heavy Stress Benchmark (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Heavy Stress Benchmark
        run: cargo test --release --test stress_benchmark -- --nocapture

  security-audit:
    name: Security Audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Cargo Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [test, stress-benchmark, security-audit]
    if: always()
    steps:
      - name: Verify All Checks Passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.stress-benchmark.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "One or more required CI checks failed."
            exit 1
          fi
          echo "All CI checks completed successfully."

