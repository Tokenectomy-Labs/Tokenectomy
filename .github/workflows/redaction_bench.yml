name: Redaction Benchmark & Regression Gate

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/redact.rs"
      - "src/lib.rs"
      - "benches/redaction_suite/**"
      - ".github/workflows/redaction_bench.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/redact.rs"
      - "src/lib.rs"
      - "benches/redaction_suite/**"
      - ".github/workflows/redaction_bench.yml"
  workflow_dispatch:

permissions: read-all

jobs:
  redaction-gate:
    name: Secret Redaction & Token Reduction Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"


      - name: Install Gitleaks Binary
        run: |
          mkdir -p benches/redaction_suite/bin
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o "/tmp/gitleaks.tar.gz"
          tar -xzf "/tmp/gitleaks.tar.gz" -C benches/redaction_suite/bin gitleaks
          rm -f "/tmp/gitleaks.tar.gz"
          chmod +x benches/redaction_suite/bin/gitleaks
          benches/redaction_suite/bin/gitleaks version

      - name: Run Redaction Benchmark Suite & Quality Gate
        run: |
          chmod +x benches/redaction_suite/run_suite.sh
          benches/redaction_suite/run_suite.sh

      - name: Upload Redaction Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: redaction-benchmark-reports
          path: |
            benches/redaction_suite/corpus/score_report.json
            benches/redaction_suite/corpus/token_reduction_report.json
            benches/redaction_suite/corpus/benchmark_report.md
            benches/redaction_suite/corpus/runner_results.json
