name: "🐛 Bug Report"
description: "File a bug report or unexpected parser/redaction behavior"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve it.
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe what went wrong..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal Reproducible Example / Raw Trace"
      description: "Provide the minimal command or raw stack trace that triggers the unexpected behavior."
      render: shell
      placeholder: "npm test 2>&1 | razor --scrub"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected vs Actual Behavior"
      description: "What did you expect to happen vs what actually happened?"
      placeholder: "Expected [TOKEN_REDACTED] but raw secret was present..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "Rust version and OS (`rustc --version`, `uname -a`, or Windows version)."
      placeholder: "rustc 1.80.0, Ubuntu 24.04 / macOS 14 / Windows 11"
    validations:
      required: false
